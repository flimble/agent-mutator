name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.2.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Prepare version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "Tag v$VERSION already exists"
              exit 1
            fi
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
            cargo check
          else
            ACTUAL=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
            [ "$ACTUAL" = "$VERSION" ] || { echo "Tag version differs from Cargo.toml"; exit 1; }
          fi

      - name: Build and validate
        run: |
          cargo build --locked
          cargo clippy --locked --all-targets
          cargo test --locked

      - name: Commit version and tag validated source
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git diff --cached --quiet || git commit -m "bump version to $VERSION"
          git tag "v$VERSION"
          # Use GITHUB_TOKEN for this push to avoid triggering a second release
          # workflow from the tag. This job publishes the release below.
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --verify-tag \
            --title "agent-mutator v$VERSION" --generate-notes

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          curl --fail --location --retry 3 "https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz" -o release.tar.gz
          SHA256=$(shasum -a 256 release.tar.gz | awk '{print $1}')
          gh auth setup-git
          gh repo clone flimble/homebrew-tap tap
          cd tap
          sed -i "s|url \".*\"|url \"https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz\"|" Formula/agent-mutator.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Formula/agent-mutator.rb
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/agent-mutator.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-mutator.rb
          git diff --cached --quiet || git commit -m "agent-mutator ${TAG}"
          git push
